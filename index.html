<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flugduell">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F15" media="(prefers-color-scheme: dark)">
<title>Flugduell</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: App-Stapel – Kopfzeile mit Punktestand, Karte als Hero, Flugkarte, Tippkarten, fester Aktionsbutton unten */
:root{
  --bg:#F2F4F7; --card:#FFFFFF; --ink:#0E1621; --muted:#677385; --line:#E3E7ED; --soft:#EEF1F5;
  --accent:#2F6BFF; --p1:#FF5A36; --p2:#0FB5A3; --ok:#12A150; --bad:#E5484D;
  --p1-soft:rgba(255,90,54,.12); --p2-soft:rgba(15,181,163,.13); --ok-soft:rgba(18,161,80,.12); --bad-soft:rgba(229,72,77,.12);
  --shadow:0 1px 2px rgba(14,22,33,.06),0 8px 24px rgba(14,22,33,.06);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:22px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A0F15; --card:#131A23; --ink:#EEF2F7; --muted:#8B97A8; --line:#222C38; --soft:#1A232E;
  --accent:#6E9BFF; --p1:#FF7A5C; --p2:#2DD4BF; --ok:#3DD68C; --bad:#FF6B6F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Kopfzeile */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted)}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px}
.sp{display:flex;align-items:center;gap:10px;min-width:0}
.sp.r{flex-direction:row-reverse;text-align:right}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-family:var(--f-display)}
.sp .col{display:flex;flex-direction:column;min-width:0}
.sp.r .col{align-items:flex-end}
.sp .nm{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sp .pt{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.vs{display:flex;flex-direction:column;align-items:center;padding:0 12px;color:var(--muted);font-size:12px}
.vs b{font-family:var(--f-mono);color:var(--ink);font-size:15px}

/* Karte */
.mapcard{position:relative;overflow:hidden;padding:0}
#map{height:min(42vh,340px);width:100%;background:var(--soft)}
.chip{position:absolute;z-index:500;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.chip.live{top:12px;left:12px}
.chip.center{top:12px;right:12px;cursor:pointer}
.chip.style{bottom:24px;right:12px;cursor:pointer}
#map{background:#1f2328}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.stale .dot{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.plane-ic{color:var(--accent)}
.plane-ic svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ap-ic{width:12px;height:12px;border-radius:50%;background:#1a1a1a;border:3px solid #fff}
.leaflet-tooltip.apt{background:var(--ink);color:var(--card);border:0;border-radius:8px;font:600 11px var(--f-mono);padding:3px 7px;box-shadow:none}
.leaflet-tooltip.apt:before{display:none}
.leaflet-container{font-family:var(--f-body)}
.leaflet-control-attribution{font-size:9px}

/* Flugkarte */
.flight{padding:18px;display:flex;flex-direction:column;gap:16px}
.fh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fh h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1.1}
.cs{font:600 13px var(--f-mono);background:var(--soft);border-radius:8px;padding:5px 9px;white-space:nowrap}
.rt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.ap{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.ap.to{text-align:right;align-items:flex-end}
.ap .code{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.95;letter-spacing:-.02em}
.ap .city{font-weight:700;margin-top:4px}
.ap .an{font-size:12px;color:var(--muted)}
.ap .tm{font:600 13px var(--f-mono);margin-top:6px}
.rt .mid{padding-top:12px;color:var(--muted)}
.bar{position:relative;height:6px;border-radius:99px;background:var(--soft);margin:4px 0 2px}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 40%,transparent),var(--accent))}
.bar .pl{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font:600 17px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fine{font-size:12px;color:var(--muted)}
.fine a{color:var(--accent);text-decoration:none;font-weight:600}

/* Tipps */
.hintbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:700}
.hintbtn:disabled{opacity:.45}
.guesses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden}
.gc:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.gc .who{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0}
.gc .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .who i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.gc input{width:100%;font:600 17px var(--f-mono);padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);-webkit-text-security:disc;text-transform:uppercase}
.gc input:focus{border-color:var(--c);outline:none}
.go{padding:11px;border-radius:12px;background:var(--c);color:#fff;font-weight:800}
.opt{width:100%;padding:12px;border-radius:12px;background:var(--soft);font:600 15px var(--f-mono);text-align:center;border:1.5px solid transparent}
.opt:active{border-color:var(--c)}
.done{border-radius:12px;padding:14px 10px;text-align:center;background:var(--cs);font-weight:700;font-size:13px}
.done .ck{display:block;font-size:22px;color:var(--c)}
.link{font-size:12px;color:var(--muted);text-decoration:underline;align-self:center}
.err{font-size:12px;color:var(--bad)}
.lbl{font-size:12px;color:var(--muted)}

/* Auflösung */
.reveal{padding:20px;display:flex;flex-direction:column;gap:14px;text-align:center}
.reveal .ty{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1}
.reveal .sub{font:600 13px var(--f-mono);color:var(--muted)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.res div{border-radius:14px;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.res .ok{background:var(--ok-soft)}
.res .bad{background:var(--bad-soft)}
.res b{display:block}
.res .ok em{color:var(--ok);font-style:normal;font-weight:800}
.res .bad em{color:var(--bad);font-style:normal;font-weight:800}

/* Aktionsleiste */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:1000;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.dock .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.cta{flex:1;padding:16px;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px;box-shadow:var(--shadow)}
.cta:disabled{opacity:.4}
.ghost{padding:16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-weight:700;color:var(--muted)}

/* Start */
.hero{padding:28px 22px;display:flex;flex-direction:column;gap:18px}
.hero h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:.95}
.hero p{margin:0;color:var(--muted)}
.field{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:6px 6px 6px 14px;border:1.5px solid transparent}
.field:focus-within{border-color:var(--c)}
.field i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.field input{flex:1;min-width:0;border:0;background:none;font:700 17px var(--f-body);color:var(--ink);padding:12px 0;outline:none}
.rules{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted);padding:0;margin:0;list-style:none}
.rules li{display:flex;gap:10px}
.rules li b{color:var(--ink)}

/* Laden */
.loading{padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.radar{width:72px;height:72px;border-radius:50%;position:relative;background:radial-gradient(circle,var(--soft) 0 30%,transparent 31%),repeating-radial-gradient(circle,transparent 0 11px,var(--line) 11px 12px)}
.radar:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 45%,transparent),transparent 25%);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.problem{padding:18px;display:flex;flex-direction:column;gap:10px}
.problem b{color:var(--bad)}
.diag{font:11px/1.55 var(--f-mono);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:12px;padding:10px;max-height:220px;overflow:auto}
.sheet{padding:18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.small{padding:10px 14px;border-radius:12px;background:var(--soft);font-weight:700}
.small.danger{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <div class="brand"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>Flugduell</div>
    <button class="iconbtn" id="menuBtn" aria-label="Spiel-Menü"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></button>
  </header>
  <div id="menu" hidden></div>
  <div id="score"></div>
  <section class="card mapcard" id="mapcard" hidden>

  <main id="app" class="wrap" style="gap:14px"></main>
</div>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>

const PIDS=["p1","p2"];

function normalize(raw){
  let s=(raw||"").toUpperCase().replace(/AIRBUS|BOEING|[\s\-_.]/g,"");
  if(!s) return null;
  if(/DREAMLINER/.test(s)) return "787";
  if(/JUMBO/.test(s)) return "747";
  if(/TRIPLESEVEN/.test(s)) return "777";
  if(/^(737)?MAX/.test(s)) return "737";
  if(TYPE[s.slice(0,4)]) return TYPE[s.slice(0,4)];
  let m=s.match(/^A?(220|318|319|320|321|330|340|350|380)/); if(m) return "A"+m[1];
  m=s.match(/^B?(7[3-8]7)/); if(m) return m[1];

// ===================== Geo =====================
const R=3440.065, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
function dist(a,b){const dl=rad(b[0]-a[0]),dn=rad(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));}
function gc(a,b,n=64){const p1=[rad(a[0]),rad(a[1])],p2=[rad(b[0]),rad(b[1])],d=dist(a,b)/R;if(d<1e-6)return[a,b];const out=[];
  for(let i=0;i<=n;i++){const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
    const x=A*Math.cos(p1[0])*Math.cos(p1[1])+B*Math.cos(p2[0])*Math.cos(p2[1]),y=A*Math.cos(p1[0])*Math.sin(p1[1])+B*Math.cos(p2[0])*Math.sin(p2[1]),z=A*Math.sin(p1[0])+B*Math.sin(p2[0]);
    out.push([deg(Math.atan2(z,Math.hypot(x,y))),deg(Math.atan2(y,x))]);}
  return unwrap(out);}
function unwrap(pts,ref){const o=[];let prev=ref??null;for(const p of pts){let lon=p[1];if(prev!==null){while(lon-prev>180)lon-=360;while(lon-prev<-180)lon+=360;}o.push([p[0],lon]);prev=lon;}return o;}

// ===================== Live-Daten =====================
const SRC=[
 ["adsb.lol",(la,lo,r)=>`https://api.adsb.lol/v2/point/${la}/${lo}/${r}`,h=>`https://api.adsb.lol/v2/hex/${h}`],
 ["adsb.fi",(la,lo,r)=>`https://opendata.adsb.fi/api/v2/lat/${la}/lon/${lo}/dist/${r}`,h=>`https://opendata.adsb.fi/api/v2/hex/${h}`],
 ["airplanes.live",(la,lo,r)=>`https://api.airplanes.live/v2/point/${la}/${lo}/${r}`,h=>`https://api.airplanes.live/v2/hex/${h}`]];
// Eigene Cloudflare-Weiterleitung zuerst, direkt als Reserve
const PROXY="https://flugduell-proxy.hendrik-bollinger.workers.dev/?url=";
const VIA=[["Cloudflare",u=>PROXY+encodeURIComponent(u)],["direkt",u=>u]];
let DIAG=[];const note=m=>{DIAG.push(m);if(DIAG.length>80)DIAG.shift();};
const errTxt=e=>e.name==="AbortError"?"Zeitüberschreitung":/Load failed|Failed to fetch|NetworkError/.test(e.message)?"blockiert":e.message;
let best=null; // {s,v} letzte funktionierende Kombination
async function getJSON(url,ms=9000,signal){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  const onAbort=()=>ctl.abort();signal&&signal.addEventListener("abort",onAbort);
  try{const r=await fetch(url,{signal:ctl.signal,cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const txt=await r.text();return JSON.parse(txt);}
  finally{clearTimeout(t);signal&&signal.removeEventListener("abort",onAbort);}}
// Alle Kombinationen parallel – die erste Antwort gewinnt
async function race(attempts,ms){
  const ctl=new AbortController();
  try{return await Promise.any(attempts.map(a=>getJSON(a.url,ms,ctl.signal).then(d=>({d,a})).catch(e=>{if(!ctl.signal.aborted)note(`${a.label}: ${errTxt(e)}`);throw e;})));}
  catch(e){throw new Error("alle Wege blockiert");}
  finally{ctl.abort();}
}
async function adsbAny(kind,...args){
  if(best){try{const d=await getJSON(best.v[1](best.s[kind](...args)),8000);return {ac:d.ac||d.aircraft||[],src:best.s[0]+" über "+best.v[0]};}catch(e){note(`${best.s[0]} über ${best.v[0]}: ${errTxt(e)}`);}}
  const attempts=[];for(const s of SRC)for(const v of VIA)attempts.push({url:v[1](s[kind](...args)),label:`${s[0]} über ${v[0]}`,s,v});
  const {d,a}=await race(attempts,10000);best={s:a.s,v:a.v};
  return {ac:d.ac||d.aircraft||[],src:a.label};
}
let adsbdbVia=null;
async function routeAdsbdb(cs){
  const u="https://api.adsbdb.com/v0/callsign/"+cs;let r;
  try{
    if(adsbdbVia){try{r=await getJSON(adsbdbVia[1](u),8000);}catch(e){r=null;}}
    if(!r){const res=await race(VIA.map(v=>({url:v[1](u),label:"Route über "+v[0],v})),9000);r=res.d;adsbdbVia=res.a.v;}
    const f=r.response&&r.response.flightroute;if(!f)return null;
    const m=a=>({icao:a.icao_code,iata:a.iata_code,name:a.name,location:a.municipality,lat:a.latitude,lon:a.longitude});
    return {callsign:cs,_airports:[m(f.origin),m(f.destination)],plausible:true};
  }catch(e){return null;}
}
function parseCs(ac){const cs=(ac.flight||"").trim();const m=cs.match(/^([A-Z]{3})(\d{1,4})([A-Z]{0,2})$/);if(!m)return null;return {cs,al:m[1],num:+m[2]};}
function isCandidate(ac){
  if(!ac||typeof ac.alt_baro!=="number"||ac.alt_baro<12000)return false;
  if(ac.lat==null||ac.lon==null||!TYPE[ac.t])return false;
  if((ac.dbFlags||0)&1)return false;
  const c=parseCs(ac);if(!c||!AL[c.al])return false;
  if(c.num>=9000)return false;
  if(["UAE","QTR","ETD","SIA","CPA","THY","KAL","AAR","CAL","EVA","CSN","CES","CCA","ETH","SVA","DLH","AFR","KLM","BAW"].includes(c.al)&&c.num>=8000)return false;
  return true;
}
function legFor(rt,pos){
  const a=rt._airports.filter(x=>x&&x.lat!=null);if(a.length<2)return null;let b=null;
  for(let i=0;i<a.length-1;i++){const o=[a[i].lat,a[i].lon],d=[a[i+1].lat,a[i+1].lon];const dev=dist(o,pos)+dist(pos,d)-dist(o,d);if(!b||dev<b.dev)b={dev,o:a[i],d:a[i+1]};}
  return b;
}
let searchCtl=null;
async function findFlight(exclude){
  const regions=[...REGIONS].sort(()=>Math.random()-.5).slice(0,4);
  for(let i=0;i<regions.length;i++){
    if(searchCtl&&searchCtl.cancelled)return null;
    setStatus(i===0?"Radar läuft …":"Noch kein passender Flug, suche woanders …");
    const [la,lo]=regions[i];
    let data;try{data=await adsbAny(1,la,lo,180);}catch(e){note("Gebiet "+(i+1)+": keine Daten");if(i>=1&&!best)return null;continue;}
    const cands=data.ac.filter(isCandidate).filter(a=>!exclude.has(a.hex)).sort(()=>Math.random()-.5).slice(0,6);
    note(`${data.src}: ${data.ac.length} Flugzeuge, ${cands.length} Kandidaten`);
    if(!cands.length)continue;
    setStatus(`${cands.length} Linienflüge gefunden, prüfe Routen …`);
    const rts=await Promise.all(cands.map(a=>routeAdsbdb(parseCs(a).cs)));
    for(let k=0;k<cands.length;k++){
      const ac=cands[k],rt=rts[k];if(!rt)continue;
      const leg=legFor(rt,[ac.lat,ac.lon]);if(!leg)continue;
      const total=dist([leg.o.lat,leg.o.lon],[leg.d.lat,leg.d.lon]);
      if(total<150||leg.dev>Math.max(250,total*0.25))continue;
      if(dist([ac.lat,ac.lon],[leg.d.lat,leg.d.lon])<120)continue;
      return {hex:ac.hex,cs:parseCs(ac).cs,al:parseCs(ac).al,type:ac.t,reg:ac.r||"",o:leg.o,d:leg.d,ac};
    }
    note("Keine plausible Route in diesem Gebiet");
  }
  return null;
}

// ===================== Zustand =====================
const KEY="flugduell-v2";let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!S.history)S={players:null,history:[],round:null};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function scores(){const s={p1:0,p2:0};for(const r of S.history)for(const p of PIDS)if(r.guess[p]===r.answer)s[p]++;return s;}
let live=null,lastOk=0,phase="idle",menuOpen=false,confirmReset=false;

async function newRound(){
  phase="loading";DIAG=[];searchCtl={cancelled:false};render();
  const recent=new Set(S.history.slice(-60).map(h=>h.hex));
  let f=null;try{f=await findFlight(recent);}catch(e){note("Fehler: "+e.message);}
  if(searchCtl.cancelled){phase="idle";render();return;}
  if(!f){phase="error";render();return;}
  phase="idle";
  S.round={...f,ac:undefined,options:null,guess:{p1:null,p2:null},mode:{p1:"text",p2:"text"},draft:{p1:"",p2:""},revealed:false,trail:[[f.ac.lat,f.ac.lon,f.ac.alt_baro]]};
  live=f.ac;lastOk=Date.now();save();render();resetMap();
}
function drawOptions(){
  const r=S.round,model=TYPE[r.type],total=dist([r.o.lat,r.o.lon],[r.d.lat,r.d.lon]);
  const fleet=AL[r.al][1].filter(t=>t!==model);
  const fits=t=>total>=RANGE[t][0]&&total<=RANGE[t][1];
  const near=t=>Math.abs(RANGE[t][1]-total);
  const others=[...fleet.filter(fits).sort(()=>Math.random()-.5),...fleet.filter(t=>!fits(t)).sort((a,b)=>near(a)-near(b))].slice(0,2);
  r.options=[model,...others].sort(()=>Math.random()-.5);
  for(const p of PIDS)if(!r.guess[p]){r.mode[p]="mc";r.draft[p]="";}
  save();render();
}
function lockText(pid){const raw=document.getElementById("in-"+pid).value;const m=normalize(raw);
  if(!m){const e=document.getElementById("err-"+pid);e.textContent="Typ nicht erkannt – z. B. A330, 787, B77W";e.hidden=false;return;}
  S.round.guess[pid]=m;save();render();}
function pickOption(pid,t){S.round.guess[pid]=t;S.round.mode[pid]="mc";save();render();}
function unlock(pid){S.round.guess[pid]=null;save();render();}
function reveal(){const r=S.round;r.revealed=true;S.history.push({hex:r.hex,cs:r.cs,answer:TYPE[r.type],guess:{...r.guess},mode:{...r.mode}});save();render();}

// ===================== Karte =====================
let map,layers=[],planeMk,trailGrp,tiles;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PLANE_SVG=a=>`<svg width="36" height="36" viewBox="0 0 24 24" style="transform:rotate(${a}deg)"><path fill="#FFC21A" stroke="#1a1a1a" stroke-width=".8" stroke-linejoin="round" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>`;
function initMap(){
  if(map||!window.L)return;
  map=L.map("map",{zoomControl:false,attributionControl:true});
  setTiles();
}
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";
function setTiles(){
  if(!map)return;tiles&&tiles.forEach(t=>map.removeLayer(t));
  const sat=S.mapStyle==="sat",att='Tiles © <a href="https://www.esri.com/">Esri</a>';
  const urls=sat?[ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}",ESRI+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"]
    :[ESRI+"Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",ESRI+"Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"];
  tiles=urls.map((u,i)=>L.tileLayer(u,{maxZoom:16,attribution:i?"":att}).addTo(map));
  tiles.forEach(t=>t.bringToBack());
  setTxt("styleBtn",sat?"Karte":"Satellit");
}
function altColor(a){if(a==null)return "#9aa4b2";const h=55+Math.min(Math.max(a,0),41000)/41000*230;return `hsl(${h},95%,58%)`;}
function drawTrail(){
  if(!map||!S.round)return;trailGrp&&map.removeLayer(trailGrp);trailGrp=L.layerGroup().addTo(map);
  const ref=gc([S.round.o.lat,S.round.o.lon],[S.round.d.lat,S.round.d.lon])[0][1];
  const pts=unwrap(S.round.trail,ref);
  for(let i=1;i<pts.length;i++)L.polyline([pts[i-1],pts[i]],{color:altColor(S.round.trail[i][2]),weight:4,lineCap:"round"}).addTo(trailGrp);
  return pts;
}
function resetMap(){
  const r=S.round;const mc=document.getElementById("mapcard");
  if(!r||!r.o){mc.hidden=true;return;}
  mc.hidden=false;initMap();if(!map)return;
  map.invalidateSize();
  layers.forEach(l=>map.removeLayer(l));layers=[];
  const line=gc([r.o.lat,r.o.lon],[r.d.lat,r.d.lon]),ref=line[0][1];
  layers.push(L.polyline(line,{color:"#ffffff",opacity:.55,weight:2,dashArray:"2 7",lineCap:"round"}).addTo(map));
  const apIcon=L.divIcon({className:"",html:'<div class="ap-ic"></div>',iconSize:[18,18],iconAnchor:[9,9]});
  layers.push(L.marker(line[0],{icon:apIcon}).bindTooltip(r.o.iata||r.o.icao,{permanent:true,direction:"top",offset:[0,-8],className:"apt"}).addTo(map));
  layers.push(L.marker(line.at(-1),{icon:apIcon}).bindTooltip(r.d.iata||r.d.icao,{permanent:true,direction:"top",offset:[0,-8],className:"apt"}).addTo(map));
  const last=drawTrail().at(-1);
  planeMk=L.marker(last,{icon:L.divIcon({className:"plane-ic",html:PLANE_SVG(live?.track||0),iconSize:[36,36],iconAnchor:[18,18]}),zIndexOffset:1000}).addTo(map);layers.push(planeMk);
  map.fitBounds(L.latLngBounds(line.concat([last])),{padding:[36,36]});
}
function updatePlane(){
  if(!map||!planeMk||!live||!S.round)return;
  const pts=drawTrail();
  planeMk.setLatLng(pts.at(-1));planeMk.setIcon(L.divIcon({className:"plane-ic",html:PLANE_SVG(live.track||0),iconSize:[36,36],iconAnchor:[18,18]}));
}
document.getElementById("styleBtn").onclick=()=>{S.mapStyle=S.mapStyle==="sat"?"map":"sat";save();setTiles();};
document.getElementById("center").onclick=()=>{if(map&&planeMk)map.setView(planeMk.getLatLng(),Math.max(map.getZoom(),7));};

// ===================== Live-Abfrage =====================
let polling=false;
async function poll(){
  const r=S.round;if(!r||!r.hex||document.hidden||polling||phase==="loading")return;
  polling=true;
  try{const d=await adsbAny(2,r.hex);const ac=d.ac[0];
    if(ac&&ac.lat!=null){live=ac;lastOk=Date.now();const last=r.trail.at(-1);
      if(!last||dist(last,[ac.lat,ac.lon])>1){r.trail.push([ac.lat,ac.lon,typeof ac.alt_baro==="number"?ac.alt_baro:null]);if(r.trail.length>800)r.trail.shift();save();}
      updatePlane();}
  }catch(e){}
  polling=false;updateFacts();
}
setInterval(poll,6000);
setInterval(updateFacts,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll();});

// ===================== Darstellung =====================
const $=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtT=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
function dur(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),mm=m%60;return h?`${h} h ${String(mm).padStart(2,"0")} min`:`${mm} min`;}
const P=i=>({id:PIDS[i],name:S.players?S.players[i]:["Spieler 1","Spieler 2"][i],c:i?"var(--p2)":"var(--p1)",cs:i?"var(--p2-soft)":"var(--p1-soft)"});
function calc(){
  const r=S.round;if(!r||!live)return null;const pos=[live.lat,live.lon],o=[r.o.lat,r.o.lon],d=[r.d.lat,r.d.lon];
  const gs=Math.max(180,live.gs||450),flown=dist(o,pos),rem=dist(pos,d);
  const el=flown/Math.max(gs,420)*60+14,remain=live.alt_baro==="ground"?0:rem/Math.max(gs,300)*60+12;
  return {el,remain,pct:Math.min(100,flown/(flown+rem)*100),dep:Date.now()-el*60000,arr:Date.now()+remain*60000};
}
function setTxt(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
function updateFacts(){
  const c=calc();
  if(c&&live){
    const alt=live.alt_baro==="ground"?"am Boden":live.alt_baro.toLocaleString("de-DE")+" ft";
    const vr=live.baro_rate||0;
    setTxt("alt",alt+(vr>500?" ↗":vr<-500?" ↘":""));
    setTxt("gs",live.gs?Math.round(live.gs*1.852).toLocaleString("de-DE")+" km/h":"–");
    setTxt("el",dur(c.el));setTxt("rem",c.remain>0?dur(c.remain):"gelandet");
    setTxt("dep","ca. "+fmtT(c.dep));setTxt("arr","ca. "+fmtT(c.arr));
    const f=document.getElementById("fill");if(f)f.style.width=c.pct+"%";
  }
  const lv=document.getElementById("live");if(lastOk){const age=(Date.now()-lastOk)/1000;lv.classList.toggle("stale",age>40);
    setTxt("livetxt",age>40?`Signal weg seit ${Math.max(1,Math.round(age/60))} min`:"Live");}
}
function dock(btns){const d=document.getElementById("dock"),i=document.getElementById("dockIn");i.innerHTML="";if(!btns.length){d.hidden=true;return;}d.hidden=false;btns.forEach(b=>i.appendChild(b));}
function btn(cls,txt,fn,dis){const b=$(`<button class="${cls}">${txt}</button>`);b.onclick=fn;if(dis)b.disabled=true;return b;}
function setStatus(t){setTxt("status",t);}

function renderScore(){
  const sc=scores(),r=S.round,rn=S.history.length+(r&&!r.revealed?1:0);const a=P(0),b=P(1);

function renderMenu(){
  const m=document.getElementById("menu");m.hidden=!menuOpen;m.innerHTML="";if(!menuOpen)return;

  else{row.appendChild(btn("small danger","Ja, alle Punkte löschen",()=>{S.history=[];confirmReset=false;menuOpen=false;save();render();}));row.appendChild(btn("small","Abbrechen",()=>{confirmReset=false;renderMenu();}));}
  box.appendChild(row);m.appendChild(box);

document.getElementById("menuBtn").onclick=()=>{menuOpen=!menuOpen;confirmReset=false;renderMenu();};

function render(){
  const app=document.getElementById("app");app.innerHTML="";

    document.getElementById("mapcard").hidden=true;

  if(!r){document.getElementById("mapcard").hidden=true;
    app.appendChild($(`<section class="card loading"><div class="radar"></div><b>Bereit für den nächsten Flug</b></section>`));

  const name=AL[r.al][0];
  app.appendChild($(`<section class="card flight">
    <div class="fh"><h1>${esc(name)}</h1><span class="cs">${esc(r.cs)}</span></div>
    <div class="rt">
      <div class="ap"><span class="eyebrow">Von</span><span class="code">${esc(r.o.iata||r.o.icao)}</span><span class="city">${esc(r.o.location||"")}</span><span class="an">${esc(r.o.name||"")} · ${esc(r.o.icao)}</span><span class="tm" id="dep">–</span></div>
      <div class="mid"><svg width="22" height="22" viewBox="0 0 24 24" style="transform:rotate(90deg)"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
      <div class="ap to"><span class="eyebrow">Nach</span><span class="code">${esc(r.d.iata||r.d.icao)}</span><span class="city">${esc(r.d.location||"")}</span><span class="an">${esc(r.d.name||"")} · ${esc(r.d.icao)}</span><span class="tm" id="arr">–</span></div>
    </div>
    <div class="bar"><div class="fill" id="fill" style="width:0"></div></div>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Seit Abflug</span><span class="v" id="el">–</span></div>
      <div class="stat"><span class="eyebrow">Bis zum Ziel</span><span class="v" id="rem">–</span></div>
      <div class="stat"><span class="eyebrow">Flughöhe</span><span class="v" id="alt">–</span></div>
      <div class="stat"><span class="eyebrow">Tempo</span><span class="v" id="gs">–</span></div>
    </div>
    <span class="fine">Position, Höhe und Tempo live per ADS-B. Zeiten in deiner Zeitzone, aus der Live-Position berechnet.</span>
  </section>`));

  if(!r.revealed){
    const hb=btn("hintbtn",r.options?"3 Typen zur Auswahl gezogen":"3 Typen zeigen",drawOptions,!!r.options);app.appendChild(hb);
    const g=$(`<div class="guesses"></div>`);
    PIDS.forEach((pid,i)=>{const p=P(i);
      const el=$(`<section class="card gc" style="--c:${p.c};--cs:${p.cs}"><div class="who"><i></i><span>${esc(p.name)}</span></div></section>`);
      if(r.guess[pid]){el.appendChild($(`<div class="done"><span class="ck">✓</span>Tipp verdeckt abgegeben</div>`));el.appendChild(btn("link","Tipp ändern",()=>unlock(pid)));}
      else if(r.mode[pid]==="mc"&&r.options){el.appendChild($(`<span class="lbl">Wähle einen Typ</span>`));for(const t of r.options)el.appendChild(btn("opt",t,()=>pickOption(pid,t)));}
      else{el.appendChild($(`<span class="lbl">Freitext, z. B. A330</span>`));
        const inp=$(`<input id="in-${pid}" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="Typ" aria-label="Tipp von ${esc(p.name)}">`);
        inp.value=r.draft[pid]||"";inp.oninput=()=>{r.draft[pid]=inp.value;save();};inp.onkeydown=e=>{if(e.key==="Enter")lockText(pid)};
        el.appendChild(inp);el.appendChild($(`<span class="err" id="err-${pid}" hidden></span>`));el.appendChild(btn("go","Abgeben",()=>lockText(pid)));}
      g.appendChild(el);});
    app.appendChild(g);
    const both=r.guess.p1&&r.guess.p2;
    dock([btn("ghost","Anderer Flug",newRound),btn("cta",both?"Auflösen":"Auflösen (1 Tipp fehlt)",reveal,!(r.guess.p1||r.guess.p2))]);
  }else{
    const h=S.history.at(-1);
    const box=$(`<section class="card reveal"><span class="eyebrow">Laut Transponder</span><span class="ty">${NAMES[h.answer]}</span>
      <span class="sub">${esc(SUB[r.type]||r.type)} · ${esc(r.reg||"Kennzeichen unbekannt")}</span></section>`);
    const res=$(`<div class="res"></div>`);
    PIDS.forEach((pid,i)=>{const p=P(i),gu=h.guess[pid],ok=gu===h.answer;
      res.appendChild($(`<div class="${ok?"ok":"bad"}"><b>${esc(p.name)}</b>${gu?esc(gu):"kein Tipp"}${h.mode[pid]==="mc"?" (Auswahl)":""}<br><em>${ok?"+1 Punkt":"daneben"}</em></div>`));});
    box.appendChild(res);
    box.appendChild($(`<span class="fine"><a href="https://www.flightradar24.com/${esc(r.cs)}" target="_blank" rel="noopener">Auf Flightradar24 ansehen</a></span>`));
    app.appendChild(box);
    dock([btn("cta","Nächster Flug",newRound)]);
  }
  updateFacts();
}
load();
if(!S.players)phase="setup";
render();
if(S.round&&S.round.hex&&phase!=="setup"){resetMap();poll();}
</script>
</body>
</html>
