<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flugduell Online">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080B0F" media="(prefers-color-scheme: dark)">
<title>Flugduell Online</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest-online.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: ruhiger Instrumenten-Look – Haarlinien statt Schatten, eine Signalfarbe (Bernstein), Zahlen in Mono.
   Menü als gruppierte Einstellungsliste, Spiel als Stapel aus Karte, Flugdaten und Tippfeldern, Hauptaktion unten fixiert. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --raised:#F0F2F5; --line:rgba(12,18,28,.09); --line-strong:rgba(12,18,28,.16);
  --ink:#0B1018; --ink-2:#2A323E; --muted:#667080; --faint:#9AA2AE;
  --signal:#B9781A; --signal-soft:rgba(185,120,26,.10);
  --p1:#B9781A; --p2:#2C6FBF; --p1-soft:rgba(185,120,26,.10); --p2-soft:rgba(44,111,191,.10);
  --ok:#1E8A55; --bad:#C8423D; --ok-soft:rgba(30,138,85,.09); --bad-soft:rgba(200,66,61,.08);
  --cta:#0B1018; --cta-ink:#FFFFFF;
  --f:"Geist",-apple-system,system-ui,sans-serif; --m:"Geist Mono",ui-monospace,Menlo,monospace;
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080B0F; --surface:#0F141A; --raised:#151B23; --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --ink:#ECEFF3; --ink-2:#C4CAD3; --muted:#8B94A1; --faint:#5E6774;
  --signal:#F0B44C; --signal-soft:rgba(240,180,76,.10);
  --p1:#F0B44C; --p2:#7DB2F0; --p1-soft:rgba(240,180,76,.10); --p2-soft:rgba(125,178,240,.11);
  --ok:#4CC88A; --bad:#F07670; --ok-soft:rgba(76,200,138,.09); --bad-soft:rgba(240,118,112,.09);
  --cta:#ECEFF3; --cta-ink:#080B0F; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.cap{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* ---------- Menü ---------- */
.brand{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.logo svg{color:var(--signal)}
.status{font:500 11px var(--m);color:var(--muted);display:flex;align-items:center;gap:7px}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.intro{padding:26px 2px 10px;position:relative}
.intro h1{margin:0;font-weight:600;font-size:42px;line-height:1.02;letter-spacing:-.035em;max-width:11ch;text-wrap:balance}
.intro h1 em{font-style:normal;color:var(--signal)}
.intro p{margin:14px 0 0;color:var(--muted);max-width:36ch}
.group{display:flex;flex-direction:column;gap:8px}
.group>.cap{padding:0 4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--raised);border-radius:14px;border:1px solid var(--line)}
.seg button{padding:12px 8px;border-radius:10px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-size:11px;color:var(--faint);font-weight:400}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.list{overflow:hidden}
.opt-row{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:15px 16px;text-align:left}
.opt-row+.opt-row{border-top:1px solid var(--line)}
.opt-row .ic{width:36px;height:36px;border-radius:10px;background:var(--raised);display:grid;place-items:center;color:var(--ink-2)}
.opt-row .t{font-weight:500}
.opt-row .d{font-size:12.5px;color:var(--muted);margin-top:1px}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center}
.opt-row[aria-checked="true"] .radio{border-color:var(--signal)}
.opt-row[aria-checked="true"] .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--signal)}
.opt-row[aria-checked="true"] .ic{background:var(--signal-soft);color:var(--signal)}
.name-row{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;padding:4px 16px}
.name-row+.name-row{border-top:1px solid var(--line)}
.name-row i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.name-row input{border:0;background:none;color:var(--ink);font:500 16px var(--f);padding:13px 0;outline:none;width:100%;min-width:0}
.name-row input::placeholder{color:var(--faint)}
.resume{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.resume b{font-weight:500}
.resume .s{font-size:12.5px;color:var(--muted)}
.resume .go{font:500 13px var(--f);color:var(--signal)}

/* ---------- Spielkopf ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px}
.back{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;padding:8px 4px}
.tag{font:500 11px var(--m);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.board{display:grid;grid-template-columns:1fr auto 1fr}
.board.solo{grid-template-columns:1fr 1fr 1fr}
.cell{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell+.cell{border-left:1px solid var(--line)}
.cell .nm{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}
.cell .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .nm i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.cell .v{font:500 28px var(--m);letter-spacing:-.03em;line-height:1.1}
.cell.mid{align-items:center;justify-content:center;padding:14px 18px}
.cell.mid .v{font-size:17px;color:var(--ink-2)}
.cell.r{align-items:flex-end;text-align:right}

/* ---------- Karte ---------- */
.mapwrap{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line)}
#map{height:min(40vh,320px);width:100%;background:#1c2026}
.chip{position:absolute;z-index:500;background:rgba(12,16,22,.72);color:#E9EDF2;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px 11px;font:500 11.5px var(--m);display:flex;align-items:center;gap:7px}
.chip.live{top:10px;left:10px}
.chip.ctr{top:10px;right:10px}
.chip.sty{bottom:22px;right:10px}
.dot{width:6px;height:6px;border-radius:50%;background:#4CC88A;animation:pulse 2.2s infinite}
.stale .dot{background:#F07670;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,200,138,.55)}70%{box-shadow:0 0 0 7px rgba(76,200,138,0)}100%{box-shadow:0 0 0 0 rgba(76,200,138,0)}}
.ap-ic{width:11px;height:11px;border-radius:50%;background:#0d1520;border:2.5px solid #E6EDF5;box-shadow:0 0 0 4px rgba(230,237,245,.10)}
.ap-ic.dest{position:relative;border-color:#F0B44C;box-shadow:0 0 0 4px rgba(240,180,76,.14)}
.ap-ic.dest:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid rgba(240,180,76,.7);animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.9);opacity:0}}
.plane-wrap{position:relative;width:44px;height:44px;display:grid;place-items:center}
.plane-wrap:before{content:"";position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,61,.38),rgba(245,184,61,0) 68%)}
.plane-wrap svg{position:relative;filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
.mapwrap.chart .leaflet-tile-pane{filter:sepia(.6) hue-rotate(180deg) saturate(1.7) brightness(1.05) contrast(1.2)}
.mapwrap.sat .leaflet-tile-pane{filter:brightness(.82) contrast(1.08) saturate(.9)}
#map.leaflet-container:after{content:"";position:absolute;inset:0;z-index:300;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(3,8,16,.55))}
.hud{position:absolute;z-index:500;left:10px;bottom:22px;display:flex;gap:1px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.08)}
.hud span{background:rgba(9,14,22,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:5px 9px;display:flex;flex-direction:column;gap:1px;min-width:52px}
.hud small{font:500 8.5px var(--m);letter-spacing:.12em;color:rgba(233,237,242,.55)}
.hud b{font:600 12px var(--m);color:#F3F5F8}
.leaflet-tooltip.apt{background:rgba(9,14,22,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1)!important}
.leaflet-tooltip.apt b{color:#F0B44C;font-weight:600}
.leaflet-tooltip.apt{background:rgba(12,16,22,.85);color:#fff;border:0;border-radius:6px;font:500 10.5px var(--m);padding:3px 6px;box-shadow:none}
.leaflet-tooltip.apt:before{display:none}
.leaflet-control-attribution{font-size:9px!important;background:rgba(12,16,22,.55)!important;color:#aaa!important}
.leaflet-control-attribution a{color:#ccc!important}

/* ---------- Flug ---------- */
.flight{padding:18px 18px 16px;display:flex;flex-direction:column;gap:16px}
.fh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fh h2{margin:0;font-weight:600;font-size:21px;letter-spacing:-.02em}
.fh .cs{font:500 12.5px var(--m);color:var(--muted)}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}
.ap{display:flex;flex-direction:column;min-width:0}
.ap.to{text-align:right;align-items:flex-end}
.ap .code{font:500 34px var(--m);letter-spacing:-.04em;line-height:1}
.ap .city{font-weight:500;margin-top:8px;overflow-wrap:anywhere}
.ap .an{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ap .tm{font:400 12px var(--m);color:var(--ink-2);margin-top:6px}
.track{position:relative;height:34px;min-width:64px;align-self:center}
.track:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line-strong)}
.track .done{position:absolute;left:0;top:50%;border-top:1.5px solid var(--signal);width:0}
.track svg{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;color:var(--signal);left:0}
.data{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin:0 -18px -16px}
.data div{padding:12px 10px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.data div:first-child{padding-left:18px}
.data div+div{border-left:1px solid var(--line)}
.data .v{font:500 14px var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:460px){.data{grid-template-columns:repeat(2,1fr)}.data div:nth-child(3){border-left:0;padding-left:18px}.data div:nth-child(n+3){border-top:1px solid var(--line)}}
.fine{font-size:11.5px;color:var(--faint)}
.rel{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--signal-soft);color:var(--ink);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.rel:before{content:"";width:8px;height:8px;border-radius:50%;background:#4C9BF0;box-shadow:0 0 0 3px rgba(76,155,240,.25);flex:none}
.me-ic{width:14px;height:14px;border-radius:50%;background:#4C9BF0;border:2.5px solid #fff;box-shadow:0 0 0 6px rgba(76,155,240,.25)}
.fine a{color:var(--signal);text-decoration:none}

/* ---------- Tipps ---------- */
.hint{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;width:100%;text-align:left}
.hint b{font-weight:500}
.hint span{font-size:12.5px;color:var(--muted)}
.hint .k{font:500 12px var(--m);color:var(--signal);white-space:nowrap}
.hint:disabled .k{color:var(--faint)}
.guesses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.guesses.solo{grid-template-columns:1fr}
.gc{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gc .who{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.gc .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc .who i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.gc input{width:100%;font:500 17px var(--m);padding:12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);text-transform:uppercase;outline:none}
.gc.duo input{-webkit-text-security:disc}
.gc input:focus{border-color:var(--c)}
.gc .lbl{font-size:12px;color:var(--muted)}
.lock{padding:12px;border-radius:12px;background:var(--c);color:var(--cta-ink);font-weight:600}
.choice{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--raised);font:500 15px var(--m)}
.choice:active{border-color:var(--c)}
.sealed{border-radius:12px;padding:16px 10px;text-align:center;background:var(--cs);font-size:13px;color:var(--ink-2)}
.sealed svg{display:block;margin:0 auto 6px;color:var(--c)}
.undo{font-size:12px;color:var(--muted);align-self:center;text-decoration:underline;text-underline-offset:3px}
.err{font-size:12px;color:var(--bad)}

/* ---------- Auflösung ---------- */
.verdict{padding:22px 18px 18px;display:flex;flex-direction:column;gap:16px}
.verdict .ty{font-weight:600;font-size:34px;letter-spacing:-.035em;line-height:1}
.verdict .sub{font:400 12.5px var(--m);color:var(--muted);margin-top:6px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res.solo{grid-template-columns:1fr}
.res div{border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.res .ok{background:var(--ok-soft)}
.res .bad{background:var(--bad-soft)}
.res span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.res small{display:block;font:400 12px var(--m);color:var(--muted)}
.res em{font:600 13px var(--m);font-style:normal;white-space:nowrap}
.res .ok em{color:var(--ok)}
.res .bad em{color:var(--bad)}

/* ---------- Laden / Fehler ---------- */
.wait{padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.scope{width:84px;height:84px;border-radius:50%;position:relative;border:1px solid var(--line-strong);
  background:repeating-radial-gradient(circle,transparent 0 13px,var(--line) 13px 14px)}
.scope:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--signal-soft),transparent 28%);animation:spin 2s linear infinite}
.scope:before{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--signal)}
@keyframes spin{to{transform:rotate(1turn)}}
.wait b{font-weight:500}
.wait span{font-size:13px;color:var(--muted)}
.problem{padding:18px;display:flex;flex-direction:column;gap:10px}
.problem b{font-weight:600;color:var(--bad)}
.problem span{font-size:13px;color:var(--muted)}
.diag{font:11px/1.6 var(--m);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--raised);border-radius:10px;padding:10px;max-height:200px;overflow:auto}

/* ---------- Aktionsleiste ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:1000;
  padding:14px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,transparent,var(--bg) 40%)}
.dock .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.cta{flex:1;padding:17px;border-radius:16px;background:var(--cta);color:var(--cta-ink);font-weight:600;font-size:16px;letter-spacing:-.01em}
.cta:disabled{opacity:.35}
.sec{padding:17px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:500;color:var(--ink-2)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.rules{padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px;color:var(--muted)}
.rules b{font:600 13px var(--m);color:var(--signal);text-align:right}
.photo{margin:0 -18px;position:relative;background:var(--raised);aspect-ratio:3/2;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.photo img.in{opacity:1}
.photo .credit{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.photo .credit a{color:#fff;text-decoration:none}
.photo .none{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;color:var(--faint)}
.final{padding:24px 18px 8px;display:flex;flex-direction:column;gap:6px}
.final h1{margin:6px 0 0;font-weight:600;font-size:36px;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
.final p{margin:4px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr repeat(var(--n),auto);font-size:13.5px}
.stats>*{padding:11px 16px;border-top:1px solid var(--line)}
.stats .h{border-top:0;font-size:12px;color:var(--muted)}
.stats .n{font:500 14px var(--m);text-align:right}
.stats .tot{font-weight:600;font-size:16px}
.rounds{display:flex;flex-direction:column}
.rd{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:11px 16px;font-size:13.5px}
.rd+.rd{border-top:1px solid var(--line)}
.rd .i{font:500 12px var(--m);color:var(--faint)}
.rd .rt{font:400 12px var(--m);color:var(--muted)}
.rd .pp{display:flex;gap:6px}
.rd .pp span{font:600 11.5px var(--m);padding:3px 7px;border-radius:6px}
.rd .pp .y{background:var(--ok-soft);color:var(--ok)}
.rd .pp .n{background:var(--raised);color:var(--faint)}
/* Abzeichen */
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--raised);color:var(--faint);border:1px solid var(--line)}
.badge.on{background:var(--signal-soft);color:var(--signal);border-color:color-mix(in srgb,var(--signal) 35%,transparent)}
.achhead{padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.achhead h1{margin:0;font-weight:600;font-size:30px;letter-spacing:-.03em}
.meter{height:4px;border-radius:99px;background:var(--raised);overflow:hidden}
.meter i{display:block;height:100%;background:var(--signal);border-radius:99px}
.ach{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 16px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .t{font-weight:500}
.ach.off .t{color:var(--ink-2)}
.ach .d{font-size:12.5px;color:var(--muted);margin-top:1px}
.ach .x{font:500 11.5px var(--m);color:var(--faint);white-space:nowrap;text-align:right}
.ach.on .x{color:var(--signal)}
.toast{position:fixed;z-index:2000;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,calc(-100% - 120px));opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility 0s linear .45s;
  width:min(420px,calc(100% - 32px));display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.in{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility 0s}
.toast .cap{color:var(--signal)}
.toast b{display:block;font-weight:600;margin-top:1px}
.newach{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.newach .row{display:flex;gap:12px;align-items:center}
/* Startbildschirm */
.hero2{padding:22px 2px 4px}
.hero2 h1{margin:0;font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.035em;max-width:13ch;text-wrap:balance}
.hero2 h1 em{font-style:normal;color:var(--signal)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px 16px 16px;text-align:left;min-height:150px}
.tile:active{border-color:var(--signal)}
.tic{width:42px;height:42px;border-radius:12px;background:var(--signal-soft);color:var(--signal);display:grid;place-items:center;margin-bottom:auto}
.tt{font-weight:600;font-size:18px;letter-spacing:-.02em;margin-top:18px}
.td{font-size:12.5px;color:var(--muted);line-height:1.35;height:4.05em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.lastset{font:400 11.5px var(--m);color:var(--faint);text-align:center;padding:2px 0}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.flink{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;color:var(--ink-2);font-weight:500;font-size:14px;border:1px solid var(--line)}
.flink .num{font:500 12px var(--m);color:var(--muted)}
.badge.sm{width:24px;height:24px;border-radius:7px}
.badge.sm svg{width:15px;height:15px}
.setbox{padding:6px 16px 14px;display:flex;flex-direction:column}
.srow{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.seg.mini button{padding:10px 6px;font-size:14px}
.custom{display:flex;align-items:center;gap:8px;padding-top:10px}
.custom input{width:84px;text-align:center;font:600 20px var(--m);padding:10px 6px;border-radius:12px;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);outline:none;-moz-appearance:textfield}
.custom input::-webkit-outer-spin-button,.custom input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.custom input:focus{border-color:var(--signal)}
.custom .stp{width:44px;height:44px;border-radius:12px;background:var(--raised);border:1px solid var(--line);font:500 22px var(--f);color:var(--ink-2)}
.custom span{font-size:13px;color:var(--muted);margin-left:4px}
.hintline{font-size:12px;color:var(--muted);padding:8px 2px 0}
.rcard{display:grid;grid-template-columns:1fr auto;align-items:stretch;overflow:hidden}
.rmain{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:14px 4px 14px 16px;text-align:left;min-width:0}
.rmain b{font-weight:500}
.rmain .s{font-size:12.5px;color:var(--muted)}
.rmain .go{font:500 13px var(--f);color:var(--signal);white-space:nowrap}
.rx{width:48px;display:grid;place-items:center;color:var(--faint);border-left:1px solid var(--line)}
.rx:active{color:var(--bad)}
.rcard.ask{grid-template-columns:1fr;padding:14px 16px;gap:12px}
.rq b{font-weight:600}
.rq .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rb{padding:11px;border-radius:12px;font-weight:600;background:var(--raised);border:1px solid var(--line)}
.rb.del{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.det summary{font-size:12px;color:var(--muted);cursor:pointer;margin-top:4px}
.det .diag{margin-top:8px}
.steps{padding:4px 0}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 18px}
.step+.step{border-top:1px solid var(--line)}
.step .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--m);color:var(--signal);background:var(--signal-soft);border:1px solid color-mix(in srgb,var(--signal) 30%,transparent)}
.step b{font-weight:600}
.step p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45}
.rules{grid-template-columns:auto 1fr}
.rtext{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rtext p{margin:0;color:var(--ink-2);font-size:14.5px}
/* ===== Design-Feinschliff ===== */
body{background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--signal) 7%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.panel{box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.04)}
/* Startbildschirm */
.hero2{position:relative;padding:30px 2px 10px}
.hero2 h1{position:relative;z-index:1}
.radar-bg{position:absolute;right:-56px;top:-34px;width:220px;height:220px;opacity:.55;pointer-events:none;z-index:0}
.radar-bg .sw{transform-origin:115px 115px;animation:spin 6s linear infinite}
.hero2 .sub{position:relative;z-index:1;margin:12px 0 0;color:var(--muted);font-size:14.5px;max-width:30ch}
.tile{position:relative;overflow:hidden;min-height:168px;background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--surface) 70%,var(--raised)))}
.tile:after{content:"";position:absolute;right:14px;top:18px;width:8px;height:8px;border-right:1.6px solid var(--faint);border-top:1.6px solid var(--faint);transform:rotate(45deg)}
.tile:active{transform:scale(.985)}
.tile{transition:transform .12s}
/* Spielkopf */
.gtop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.gtop .ttl{text-align:center;font:500 12px var(--m);color:var(--muted);letter-spacing:.04em}
.gtop .tag{justify-self:end}
.sb{padding:16px 18px 14px;display:flex;flex-direction:column;gap:14px}
.sb-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sb-p{display:flex;align-items:center;gap:10px;min-width:0}
.sb-p.r{flex-direction:row-reverse;text-align:right}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);flex:none}
.sb-p .nm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-p .sc{font:600 30px var(--m);letter-spacing:-.04em;line-height:1}
.sb-p .col{display:flex;flex-direction:column;gap:3px;min-width:0}
.sb-p.r .col{align-items:flex-end}
.sb-vs{font:500 11px var(--m);color:var(--faint);letter-spacing:.1em}
.sb-meta{display:flex;justify-content:space-between;font:400 11.5px var(--m);color:var(--muted)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:4px;border-radius:99px;background:var(--raised)}
.prog i.d{background:var(--line-strong)}
.prog i.y{background:var(--ok)}
.prog i.n{background:var(--bad);opacity:.7}
.prog i.c{background:var(--signal)}
/* Karte */
#map{height:min(44vh,360px)}
.mapwrap{border-radius:22px}
/* Bordkarte */
.flight{padding:0;gap:0;overflow:hidden}
.fp-top{display:flex;align-items:center;gap:12px;padding:16px 18px}
.alb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:600 12px var(--m);letter-spacing:.02em;color:var(--signal);background:var(--signal-soft);border:1px solid color-mix(in srgb,var(--signal) 30%,transparent);flex:none}
.fp-top .an2{flex:1;min-width:0}
.fp-top h2{margin:0;font-weight:600;font-size:19px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-top .cs2{font:400 12px var(--m);color:var(--muted)}
.fp-route{display:grid;grid-template-columns:1fr minmax(70px,auto) 1fr;gap:10px;align-items:start;padding:4px 18px 18px}
.fp-ap{display:flex;flex-direction:column;min-width:0}
.fp-ap.to{text-align:right;align-items:flex-end}
.fp-ap .code{font:600 40px var(--m);letter-spacing:-.05em;line-height:1}
.fp-ap .city{font-weight:500;font-size:14.5px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fp-ap .an{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fp-ap .tm{font:500 13px var(--m);color:var(--ink);margin-top:10px}
.fp-ap .tl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.fp-mid{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:14px}
.fp-mid .track{width:100%;min-width:70px;height:20px}
.fp-mid .km{font:400 11px var(--m);color:var(--muted);white-space:nowrap}
.perf{position:relative;height:0;border-top:1px dashed var(--line-strong);margin:0 14px}
.perf:before,.perf:after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf:before{left:-25px}.perf:after{right:-25px}
.flight .data{margin:0;border-top:0}
.flight .data div:first-child{padding-left:18px}
.flight .rel{margin:0 18px 16px}
.flight #tracenote{margin:0 18px 14px!important}
/* Tipps */
.ghead{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 0}
.ghead .cap{font-size:11px}
.pill{font:500 12.5px var(--f);color:var(--signal);padding:7px 12px;border-radius:999px;background:var(--signal-soft);border:1px solid color-mix(in srgb,var(--signal) 30%,transparent)}
.pill:disabled{color:var(--faint);background:var(--raised);border-color:var(--line)}
.gc{padding:16px}
.gc .who{font-size:15px}
.gc input{font-size:20px;padding:14px;text-align:center;letter-spacing:.04em}
.gc input::placeholder{font:500 15px var(--f);letter-spacing:0;color:var(--faint);-webkit-text-security:none}
.lock,.choice{min-height:46px}
/* Auflösung */
.verdict{padding:0 0 18px;gap:0;overflow:hidden}
.vphoto{position:relative;aspect-ratio:16/10;background:var(--raised);overflow:hidden}
.vphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.vphoto img.in{opacity:1}
.vphoto .ph{position:absolute;inset:0;display:grid;place-items:center;font:600 72px var(--m);letter-spacing:-.05em;color:color-mix(in srgb,var(--ink) 7%,transparent)}
.vphoto .plink{position:absolute;inset:0;display:block}
.vphoto .ov{pointer-events:none;position:absolute;left:0;right:0;bottom:0;padding:44px 18px 14px;background:linear-gradient(transparent,rgba(5,8,12,.82));color:#fff}
.vphoto .ov .cap{color:rgba(255,255,255,.7)}
.vphoto .ov .ty{font-weight:600;font-size:32px;letter-spacing:-.035em;line-height:1.05;margin-top:4px}
.vphoto .ov .sub{font:400 12px var(--m);color:rgba(255,255,255,.75);margin-top:4px}
.vphoto .credit{position:absolute;right:10px;top:10px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:6px}
.vphoto .credit a{color:#fff;text-decoration:none}
.verdict .res{padding:16px 18px 0}
.verdict .fine{padding:12px 18px 0}
/* Leiste unten */
.dock{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 92%,transparent) 30%);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.cta{box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bigcode{font:600 64px var(--m);letter-spacing:.12em;line-height:1;margin-top:10px;color:var(--signal);position:relative;z-index:1}
.obtn{width:100%;padding:14px;border-radius:14px;background:var(--cta);color:var(--cta-ink);font-weight:600;margin-top:14px}
.obtn.sec2{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);margin-top:0}
.ojoin{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px}
.ojoin input{font:600 24px var(--m);letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:10px;border-radius:12px;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);outline:none;min-width:0}
.ojoin input:focus{border-color:var(--signal)}
.ojoin .obtn{margin:0;width:auto;padding:0 20px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px}
.prow+.prow{border-top:1px solid var(--line)}
.prow b{font-weight:500}
.prow .s{font-size:12.5px;color:var(--muted)}
.you{font:500 10.5px var(--m);color:var(--signal);background:var(--signal-soft);padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}
.odot{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.odot.on{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.waiting{border-radius:12px;padding:16px 10px;text-align:center;background:var(--raised);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.waiting b{font-weight:500}
.wd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c,var(--signal));margin:0 2px;animation:wdot 1.2s infinite}
.waiting .wd{display:none}
.waiting:before{content:"• • •";letter-spacing:.2em;color:var(--c);animation:wfade 1.4s infinite}
@keyframes wfade{50%{opacity:.3}}
@keyframes wdot{50%{opacity:.25}}
.obanner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--signal-soft);color:var(--ink-2);font-size:13px;border:1px solid color-mix(in srgb,var(--signal) 25%,transparent)}
.obanner.off{background:var(--raised);border-color:var(--line);color:var(--muted)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

const R=3440.065, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;

  for(let i=0;i<=n;i++){const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
    const x=A*Math.cos(p1[0])*Math.cos(p1[1])+B*Math.cos(p2[0])*Math.cos(p2[1]),y=A*Math.cos(p1[0])*Math.sin(p1[1])+B*Math.cos(p2[0])*Math.sin(p2[1]),z=A*Math.sin(p1[0])+B*Math.sin(p2[0]);
    out.push([deg(Math.atan2(z,Math.hypot(x,y))),deg(Math.atan2(y,x))]);}

let netFails=0; // aufeinanderfolgende Netzfehler (Zeitüberschreitung/keine Verbindung)
async function getJSON(url,ms=9000,signal){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  const onAbort=()=>ctl.abort();signal&&signal.addEventListener("abort",onAbort);
  try{const r=await fetch(url,{signal:ctl.signal,cache:"no-store"});if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}const txt=await r.text();return JSON.parse(txt);}
  finally{clearTimeout(t);signal&&signal.removeEventListener("abort",onAbort);}}
// Mit Wiederholung: bei Zeitüberschreitung, Netzfehler, 429 und 5xx bis zu `tries` Versuche mit wachsender Wartezeit
async function getRetry(url,label,tries=3,base=9000){
  let last;
  for(let i=0;i<tries;i++){
    if(searchCtl&&searchCtl.cancelled)throw new Error("abgebrochen");
    try{const d=await getJSON(url,base+i*4000);netFails=0;return d;}
    catch(e){last=e;note(`${label}: ${errTxt(e)}${i<tries-1?" – neuer Versuch":""}`);
      const net=!e.status;if(net)netFails++;
      if(e.status&&e.status!==429&&e.status<500)break;
      if(i<tries-1)await new Promise(r=>setTimeout(r,700*(i+1)));}
  }

}
async function adsbArea(la,lo,rad){const d=await getRetry(viaProxy(SRC.area(la,lo,rad)),"Live-Daten",3);return {ac:d.ac||[],src:"adsb.lol"};}

async function routeAdsbdb(cs){
  try{
    const r=await getRetry(viaProxy("https://api.adsbdb.com/v0/callsign/"+cs),"Route "+cs,2,8000);
    const f=r.response&&r.response.flightroute;if(!f)return null;
    const m=a=>({icao:a.icao_code,iata:a.iata_code,name:a.name,location:a.municipality,lat:a.latitude,lon:a.longitude});
    return {callsign:cs,_airports:[m(f.origin),m(f.destination)],plausible:true};
  }catch(e){return null;}
}
function parseCs(ac){const cs=(ac.flight||"").trim();const m=cs.match(/^([A-Z]{3})(\d{1,4})([A-Z]{0,2})$/);if(!m)return null;return {cs,al:m[1],num:+m[2]};}
function isCandidate(ac,cat,minAlt=12000){
  if(!ac||typeof ac.alt_baro!=="number"||ac.alt_baro<minAlt)return false;
  if(ac.lat==null||ac.lon==null||!TYPE[ac.t])return false;
  if((ac.dbFlags||0)&1)return false;
  const c=parseCs(ac);if(!c||!AL[c.al])return false;
  if(!inCat(TYPE[ac.t],cat))return false;
  if(cat!=="all"&&fleetIn(c.al,cat).length<2)return false;
  if(c.num>=9000)return false;
  if(["UAE","QTR","ETD","SIA","CPA","THY","KAL","AAR","CAL","EVA","CSN","CES","CCA","ETH","SVA","DLH","AFR","KLM","BAW"].includes(c.al)&&c.num>=8000)return false;
  return true;
}
function legFor(rt,pos){
  const a=rt._airports.filter(x=>x&&x.lat!=null);if(a.length<2)return null;let b=null;
  for(let i=0;i<a.length-1;i++){const o=[a[i].lat,a[i].lon],d=[a[i+1].lat,a[i+1].lon];const dev=dist(o,pos)+dist(pos,d)-dist(o,d);if(!b||dev<b.dev)b={dev,o:a[i],d:a[i+1]};}
  return b;
}
let searchCtl=null;
// Abwechslung: kürzlich gespielte Modelle und Airlines werden seltener gezogen, häufige Typen im Gebiet abgewertet
function varietyPick(cands,recent,me,n){
  const mRecent=recent.map(h=>h.answer),aRecent=recent.map(h=>(h.cs||"").slice(0,3));
  const last2M=mRecent.slice(-2),last2A=aRecent.slice(-2);
  const freq={};cands.forEach(a=>{const m=TYPE[a.t];freq[m]=(freq[m]||0)+1;});
  let pool=cands.filter(a=>{const m=TYPE[a.t],al=parseCs(a).al;return !last2M.includes(m)&&!last2A.includes(al);});
  if(pool.length<2)pool=cands.filter(a=>TYPE[a.t]!==mRecent.at(-1)&&parseCs(a).al!==aRecent.at(-1));
  if(!pool.length)pool=cands;
  const scored=pool.map(a=>{const m=TYPE[a.t],al=parseCs(a).al;
    let w=1/(1+2.5*mRecent.filter(x=>x===m).length+1.5*aRecent.filter(x=>x===al).length);
    w*=1/Math.sqrt(freq[m]||1);
    if(me)w*=1/(1+dist([me.lat,me.lon],[a.lat,a.lon])/60);
    return {a,k:Math.pow(Math.random(),1/w)};});
  return scored.sort((x,y)=>y.k-x.k).slice(0,n).map(x=>x.a);
}
async function findFlight(exclude,cat,me){
  const recent=(G()&&G().history||[]).slice(-6);
  netDown=false;
  // Weltweit: zufällige Regionen. Über mir: erst 100 nm, dann 250 nm um den eigenen Standort, nächste Flüge zuerst
  const pool=cat==="long"?LONG_REGIONS:REGIONS;
  const regions=me?[[me.lat,me.lon,100],[me.lat,me.lon,250]]:[...pool].sort(()=>Math.random()-.5).slice(0,6).map(([a,b])=>[a,b,250]);
  for(let i=0;i<regions.length;i++){
    if(searchCtl&&searchCtl.cancelled)return null;
    if(i)await new Promise(r=>setTimeout(r,800));
    setStatus(me?(i===0?"Radar sucht über dir …":"Erweitere den Suchradius …"):(i===0?"Radar läuft …":"Suche in einer anderen Region …"));
    const [la,lo,rad]=regions[i];
    let data;try{data=await adsbArea(la,lo,rad);}catch(e){note("Gebiet "+(i+1)+": keine Daten");
      if(!navigator.onLine){netDown=true;return null;}
      if(i<regions.length-1){setStatus("Verbindung hakt, versuche es erneut …");}continue;}
    let cands=data.ac.filter(a=>isCandidate(a,cat,me?2500:12000)).filter(a=>!exclude.has(a.hex));
    cands=varietyPick(cands,recent,me,me?8:6);
    note(`${data.src}: ${data.ac.length} Flugzeuge, ${cands.length} Kandidaten`);
    if(!cands.length)continue;
    setStatus(`${cands.length} Kandidaten gefunden, prüfe Routen …`);
    const rts=await Promise.all(cands.map(a=>routeAdsbdb(parseCs(a).cs)));
    for(let k=0;k<cands.length;k++){
      const ac=cands[k],rt=rts[k];if(!rt)continue;
      const leg=legFor(rt,[ac.lat,ac.lon]);if(!leg)continue;
      const total=dist([leg.o.lat,leg.o.lon],[leg.d.lat,leg.d.lon]);
      if(total<(me?80:150)||leg.dev>Math.max(250,total*0.25))continue;
      if(dist([ac.lat,ac.lon],[leg.d.lat,leg.d.lon])<(me?15:120))continue;
      return {hex:ac.hex,cs:parseCs(ac).cs,al:parseCs(ac).al,type:ac.t,reg:ac.r||"",o:leg.o,d:leg.d,ac};
    }
    note("Keine plausible Route in diesem Gebiet");
  }
  return null;
}

async function loadTrace(r){
  try{
    const h=r.hex.toLowerCase().replace(/^~/,"");let d=null,why="";
    setTraceNote("Flugverlauf wird geladen …");
    for(const kind of ["full","recent"]){
      const u=`https://globe.adsb.lol/data/traces/${h.slice(-2)}/trace_${kind}_${h}.json`;
      try{d=await getJSON(PROXY+encodeURIComponent(u),12000);if(d&&Array.isArray(d.trace)&&d.trace.length)break;why=kind+": leer";d=null;}
      catch(e){why=kind+": "+errTxt(e);}
    }
    if(!d){note("Verlauf: "+why);r.traceNote="Flugspur wird ab jetzt live aufgezeichnet";setTraceNote(r.traceNote);return;}
    const pts=d.trace.map(p=>[(d.timestamp+p[0])*1000,p[1],p[2],p[3]]).filter(p=>p[1]!=null&&p[2]!=null);
    let start=0;
    for(let i=1;i<pts.length;i++){if(pts[i-1][3]==="ground"||pts[i][0]-pts[i-1][0]>30*60000)start=i;}
    const leg=pts.slice(start);if(leg.length<2){r.traceNote="Flugverlauf zu kurz";setTraceNote(r.traceNote);return;}
    if(G()&&G().round!==r)return;
    const nearO=dist([leg[0][1],leg[0][2]],[r.o.lat,r.o.lon])<40;
    r.depTime=nearO?leg[0][0]:null;
    const step=Math.max(1,Math.ceil(leg.length/500));
    const tr=leg.filter((p,i)=>i%step===0||i===leg.length-1).map(p=>[p[1],p[2],typeof p[3]==="number"?p[3]:null]);
    const lastLive=r.trail.at(-1);if(lastLive)tr.push(lastLive);
    r.trail=tr;r.traced=true;r.traceNote=r.depTime?"":"Verlauf beginnt nicht am Abflughafen, Startzeit geschätzt";
    save();mapKey=null;if(phase==="game")showMap(true);setTraceNote(r.traceNote);tick();
  }catch(e){r.traceNote="Flugverlauf: "+errTxt(e);setTraceNote(r.traceNote);}
}

function send(m){if(O.ws&&O.ws.readyState===1){O.ws.send(JSON.stringify(m));return true;}connect();return false;}
function connect(){
  if(!O.code)return;clearTimeout(O.rt);

  let ws;try{ws=new WebSocket(WS_BASE+O.code);}catch(e){O.conn="closed";return;}
  O.ws=ws;O.conn="connecting";O.leaving=false;
  ws.onopen=()=>{if(O.ws!==ws)return;O.conn="open";O.retry=0;
    ws.send(JSON.stringify({t:"hello",pid:O.pid,name:O.name,create:O.creating,code:O.code}));if(phase!=="menu")render();};
  ws.onmessage=e=>{if(O.ws!==ws)return;let m;try{m=JSON.parse(e.data);}catch(x){return;}
    if(m.t==="state"){
      if(O.creating){O.creating=false;if(O.pending){ws.send(JSON.stringify({t:"settings",...O.pending}));O.pending=null;}}
      O.st=m.s;O.online=m.online||[];O.err="";onState();}
    else if(m.t==="error")onErr(m.err);};
  ws.onclose=()=>{if(O.ws!==ws)return;O.ws=null;O.conn="closed";
    if(O.code&&!O.leaving){O.retry=Math.min(O.retry+1,6);O.rt=setTimeout(connect,Math.min(800*2**O.retry,15000));if(phase!=="menu")render();}};
}

    history:st.history.map(h=>({...h})),round:null,finished:false};
  if(st.round){const r=st.round,f=r.flight,keep=prev&&prev.round&&prev.round.hex===f.hex?prev.round:null;
    const guess={},mode={},raw={};
    for(const seat of ["p1","p2"]){const x=r.guesses[seat];guess[seat]=x?(x.hidden?"•":x.model):null;mode[seat]=r.opts&&r.opts[seat]?"mc":"text";if(x&&x.raw)raw[seat]=x.raw;}
    if(r.revealed&&st.history.length)Object.assign(raw,st.history.at(-1).raw||{});
    g.round={...f,options:(r.opts&&r.opts[O.st.me])||null,guess,mode,raw,draft:keep?keep.draft:{},revealed:r.revealed,
      trail:keep?keep.trail:[[f.ac.lat,f.ac.lon,f.ac.alt_baro]],me:null,traceNote:""};

function derivePhase(){
  if(O.screen!=="room"||!O.code)return "menu";
  if(!O.st)return "room";
  const p=O.st.phase;
  if(p==="lobby")return "room";
  if(p==="search")return "loading";
  if(p==="searchfail")return "error";

function onState(){
  if(O.st.phase==="search"){if(O.searchKey!==O.st.searchSince){O.searchKey=O.st.searchSince;O.searchSeen=Date.now();}}else O.searchKey=null;
  if(O.st.phase==="lobby")O.showFinal=false;
  const before=phase,beforeHex=S.game&&S.game.round?S.game.round.hex:null;
  syncGame();
  // Hat der andere die Suche übernommen oder ist sie beendet, eigene Suche sofort stoppen
  if(O.searching&&!(O.st.phase==="search"&&O.st.searcherIsMe)){if(searchCtl)searchCtl.cancelled=true;O.searching=false;}
  if(O.st.phase==="search"&&O.st.searcherIsMe&&!O.searching)doSearch();
  const p=derivePhase();
  // Tippt der Spieler gerade, nur Gegner-Karte und Leiste auffrischen, damit die Tastatur nicht zuklappt
  const ae=document.activeElement,typing=ae&&ae.id&&ae.id.startsWith("in-");

  phase=p;render();

}

// ---------- Flug suchen (nur der vom Server bestimmte Spieler) ----------
// Schnelle Suche: je zwei Regionen parallel, kurze Zeitlimits, Routen zwischengespeichert, harte Obergrenze 40 s
const SEARCH_LIMIT=40000,routeCache={};
async function routeQuick(cs){
  if(cs in routeCache)return routeCache[cs];
  let r=null;
  try{const d=await getJSON(viaProxy("https://api.adsbdb.com/v0/callsign/"+cs),6000);const f=d.response&&d.response.flightroute;
    if(f){const m=a=>({icao:a.icao_code,iata:a.iata_code,name:a.name,location:a.municipality,lat:a.latitude,lon:a.longitude});r={callsign:cs,_airports:[m(f.origin),m(f.destination)]};}
    routeCache[cs]=r;}catch(e){/* bei Netzfehler nicht merken */}
  return r;
}
async function searchRegion(la,lo,cat,exclude,recent,deadline,ctl){
  let data=null;
  for(let i=0;i<2&&!data;i++){if(Date.now()>deadline||ctl.cancelled)return null;
    try{const d=await getJSON(viaProxy(SRC.area(la,lo,250)),Math.min(i?9000:7000,Math.max(1500,deadline-Date.now())));data=d.ac||[];netFails=0;}
    catch(e){note(`Region ${la},${lo}: ${errTxt(e)}`);if(!e.status)netFails++;else if(e.status!==429&&e.status<500)return null;}}
  if(!data||ctl.cancelled)return null;
  const cands=varietyPick(data.filter(a=>isCandidate(a,cat,12000)).filter(a=>!exclude.has(a.hex)),recent,null,6);
  note(`Region ${la},${lo}: ${data.length} Flugzeuge, ${cands.length} Kandidaten`);
  if(!cands.length)return null;
  // Routen parallel prüfen, der erste passende Kandidat gewinnt
  return await new Promise(res=>{let left=cands.length;
    cands.forEach(async ac=>{let hit=null;
      try{const cs=parseCs(ac).cs,rt=await routeQuick(cs);
        if(rt){const leg=legFor(rt,[ac.lat,ac.lon]);
          if(leg){const total=dist([leg.o.lat,leg.o.lon],[leg.d.lat,leg.d.lon]);
            if(total>=150&&leg.dev<=Math.max(250,total*.25)&&dist([ac.lat,ac.lon],[leg.d.lat,leg.d.lon])>=120)
              hit={hex:ac.hex,cs,al:parseCs(ac).al,type:ac.t,reg:ac.r||"",o:leg.o,d:leg.d,ac};}}}catch(e){}
      if(hit){left=-99;res(hit);}else if(--left===0)res(null);});});
}
async function findFlightFast(exclude,cat,ctl){
  const start=Date.now(),deadline=start+SEARCH_LIMIT,recent=(G()&&G().history||[]).slice(-6);
  const pool=[...(cat==="long"?LONG_REGIONS:REGIONS)].sort(()=>Math.random()-.5);
  netDown=false;netFails=0;
  const timer=setInterval(()=>!ctl.cancelled&&setStatus(`Radar läuft … ${Math.round((Date.now()-start)/1000)} s`),1000);
  try{
    for(let i=0;i<pool.length&&Date.now()<deadline&&!ctl.cancelled;i+=2){
      const wave=pool.slice(i,i+2).map(([la,lo])=>searchRegion(la,lo,cat,exclude,recent,deadline,ctl));
      const found=await new Promise(res=>{let left=wave.length;wave.forEach(p=>p.then(f=>{if(f){left=-99;res(f);}else if(--left===0)res(null);}).catch(()=>{if(--left===0)res(null);}));});
      if(found)return ctl.cancelled?null:found;
      if(!navigator.onLine){netDown=true;return null;}
    }
  }finally{clearInterval(timer);}
  if(netFails>0)netDown=true;
  return null;
}
async function doSearch(){
  // Jede Suche hat ihren eigenen Abbruch-Schalter; eine ältere Suche kann nie mehr einen Flug melden
  if(searchCtl)searchCtl.cancelled=true;
  const ctl={cancelled:false};searchCtl=ctl;O.searching=true;DIAG=[];
  const key=O.st.searchSince,recent=new Set((G()?G().history:[]).map(h=>h.hex));
  let f=null;
  try{f=await findFlightFast(recent,O.st.settings.cat,ctl);}catch(e){note("Fehler: "+e.message);}
  if(ctl.cancelled)return;
  O.searching=false;
  if(!O.st||O.st.searchSince!==key)return;
  if(!O.st||O.st.phase!=="search"||!O.st.searcherIsMe)return;
  if(!f){send({t:"fail",msg:netDown?"Die Verbindung war zu schwach, um Live-Daten zu laden.":"Gerade passte kein Flug zu euren Einstellungen."});return;}
  const a=f.ac;
  send({t:"found",flight:{hex:f.hex,cs:f.cs,al:f.al,type:f.type,model:TYPE[f.type],reg:f.reg,o:f.o,d:f.d,
    ac:{lat:a.lat,lon:a.lon,alt_baro:a.alt_baro,gs:a.gs,track:a.track,baro_rate:a.baro_rate}}});
}

  cb.appendChild(segRow("Runden",[[5,"5"],[10,"10"],[15,"15"],[0,"Endlos"]],O.newRounds,v=>{O.newRounds=v;oSave();render();}));
  const go=btn("obtn","Raum erstellen",()=>{if(!needName())return;O.code=newCode();O.creating=true;O.pending={cat:O.newCat,rounds:O.newRounds};
    O.st=null;S.game=null;O.screen="room";O.err="";O.showFinal=false;oSave();try{O.ws&&O.ws.close(1000,"bye");}catch(e){}O.ws=null;connect();phase="room";render();});
  cb.appendChild(go);cg.appendChild(cb);root.appendChild(cg);
  const jg=$(`<div class="group"><div class="cap">Raum beitreten</div></div>`),jb=$(`<section class="panel ojoin"></section>`);
  const ji=$(`<input id="ocode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Raumcode">`);ji.value=O.joinCode;
  ji.oninput=()=>{ji.value=ji.value.toUpperCase().replace(/[^A-Z0-9]/g,"");O.joinCode=ji.value;};
  const jbtn=btn("obtn","Beitreten",()=>{if(!needName())return;const c=(O.joinCode||"").toUpperCase();if(!/^[A-Z0-9]{4}$/.test(c)){ji.focus();return;}
    if(O.code&&O.code!==c)send({t:"leave"});O.code=c;O.creating=false;O.st=null;S.game=null;O.screen="room";O.err="";O.showFinal=false;oSave();try{O.ws&&O.ws.close(1000,"bye");}catch(e){}O.ws=null;connect();phase="room";render();});
  jb.append(ji,jbtn);jg.appendChild(jb);root.appendChild(jg);
  root.appendChild($(`<a class="lastset" href="./" style="text-decoration:none;margin-top:8px">← Zur Solo- & 1-vs-1-App</a>`));
  dock([]);
}
function needName(){if(O.name)return true;const i=document.getElementById("oname");if(i){i.focus();i.closest(".panel").classList.add("shake");setTimeout(()=>i.closest(".panel").classList.remove("shake"),500);}return false;}
function renderORoom(root){
  const bar=$(`<div class="bar"></div>`);bar.appendChild(btn("back",BACK+"Zurück",()=>{phase="menu";render();}));
  bar.appendChild($(`<span class="tag">Online-Raum</span>`));root.appendChild(bar);
  connBanner(root);
  const st=O.st;
  root.appendChild($(`<div class="hero2"><span class="cap">Raumcode</span><div class="bigcode">${esc(O.code||"")}</div><p class="sub">Schick deinem Mitspieler den Link oder den Code. Er öffnet ihn, gibt seinen Namen ein und ist drin.</p></div>`));
  const url=location.origin+location.pathname+"#"+O.code;
  const sh=btn("obtn sec2",O.copied?"Link kopiert ✓":"Einladung teilen",async()=>{
    const text=`Lass uns Flugduell spielen! Raum ${O.code}: ${url}`;
    try{if(navigator.share){await navigator.share({title:"Flugduell",text:`Lass uns Flugduell spielen! Raum ${O.code}`,url});return;}}catch(e){if(e&&e.name==="AbortError")return;}
    try{await navigator.clipboard.writeText(text);O.copied=true;render();setTimeout(()=>{O.copied=false;if(phase==="room")render();},2500);}catch(e){const u=document.getElementById("olink");if(u){const rg=document.createRange();rg.selectNodeContents(u);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);}}
  });
  root.appendChild(sh);
  root.appendChild($(`<div class="lastset" id="olink" style="user-select:all;-webkit-user-select:all">${esc(url)}</div>`));
  const pl=$(`<div class="group"><div class="cap">Spieler</div></div>`),pb=$(`<div class="panel list"></div>`);
  ["p1","p2"].forEach((seat,i)=>{const p=st&&st.players.find(x=>x.seat===seat),on=O.online.includes(seat);
    pb.appendChild($(`<div class="prow" style="--c:${PCOL[i]}"><span class="av">${p?esc((p.name[0]||"?").toUpperCase()):"?"}</span><div><b>${p?esc(p.name):"Noch frei"}</b>${p&&st.me===seat?" <span class='you'>du</span>":""}${p&&st.hostSeat===seat?" <span class='you'>Host</span>":""}<div class="s">${p?(on?"verbunden":"nicht verbunden"):"Warte auf Mitspieler …"}</div></div><span class="odot ${p&&on?"on":""}"></span></div>`));});
  pl.appendChild(pb);root.appendChild(pl);
  if(st){
    const sg=$(`<div class="group"><div class="cap">Einstellungen</div></div>`),sb=$(`<section class="panel setbox"></section>`);
    if(st.isHost){
      sb.appendChild(segRow("Flugzeuge",[["long","Lang"],["short","Kurz & Mittel"],["all","Alle"]],st.settings.cat,v=>send({t:"settings",cat:v,rounds:st.settings.rounds})));
      sb.appendChild(segRow("Runden",[[5,"5"],[10,"10"],[15,"15"],[0,"Endlos"]],[5,10,15,0].includes(st.settings.rounds)?st.settings.rounds:null,v=>send({t:"settings",cat:st.settings.cat,rounds:v})));
    }else sb.appendChild($(`<div class="hintline" style="padding:14px 2px 2px">${esc(CAT_SHORT[st.settings.cat])} · ${st.settings.rounds?st.settings.rounds+" Runden":"Endlos"}<br>Die Einstellungen legt ${esc(nameOf(st.hostSeat))} fest.</div>`));
    sg.appendChild(sb);root.appendChild(sg);}
  const two=st&&st.players.length===2;
  if(!st)dock([btn("cta","Verbinde …",null,true)]);
  else if(st.isHost)dock([btn("cta",two?"Spiel starten":"Warte auf Mitspieler …",()=>send({t:"next"}),!two)]);
  else dock([btn("cta",`Warte auf Start durch ${esc(nameOf(st.hostSeat))} …`,null,true)]);
}

// ---------- Start ----------
oLoad();load();
{const m=(location.hash||"").replace("#","").toUpperCase();
  if(/^[A-Z0-9]{4}$/.test(m)){if(m===O.code){O.screen="room";}else{O.joinCode=m;}history.replaceState(null,"",location.pathname);}}
if(O.code){O.screen="room";connect();}
phase=derivePhase();
render();

</script>
